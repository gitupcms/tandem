name: ci
on: [push, pull_request]
jobs:
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test ./test ./sdk ./guard

  swift:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        if: runner.os == 'Linux'
        with:
          swift-version: "6.1"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: swift build -c release --package-path swift
      - run: swift test --package-path swift
      - run: bun test ./test
        env:
          TANDEM_HOST: swift/.build/release/TandemProbe probe
          TANDEM_PLATFORM: swift
      - run: swift build --package-path swift
      - run: bun test ./test
        env:
          TANDEM_HOST: swift/.build/debug/TandemProbe probe
          TANDEM_PLATFORM: swift
          TANDEM_SOCKET: "1"
      - run: swift/check-release.sh

  kotlin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: kotlin/gradlew -p kotlin build installDist installDebugDist
      - run: bun test ./test --timeout 20000
        env:
          TANDEM_HOST: kotlin/probe-host/build/install/probe-host/bin/probe-host probe
          TANDEM_PLATFORM: kotlin
      - run: bun test ./test --timeout 20000
        env:
          TANDEM_HOST: kotlin/probe-host/build/install/probe-host-debug/bin/probe-host probe
          TANDEM_PLATFORM: kotlin
          TANDEM_SOCKET: "1"
      - run: kotlin/check-release.sh

  journeys:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: swift build -c release --package-path swift
      - run: swift build --package-path swift
      - run: kotlin/gradlew -p kotlin installDist installDebugDist
      - run: swift build -c release --package-path samples/inventory/swift
      - run: swift build --package-path samples/inventory/swift
      - run: swift test --package-path samples/inventory/swift
      - run: samples/inventory/kotlin/gradlew -p samples/inventory/kotlin build installDist installDebugDist
      - run: bun run build:guard
      - run: bun test --timeout 20000
      - run: swift/check-release.sh && kotlin/check-release.sh
