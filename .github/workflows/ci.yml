name: ci
on: [push, pull_request]
jobs:
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test

  swift:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        if: runner.os == 'Linux'
        with:
          swift-version: "6.1"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: swift build -c release --package-path swift
      - run: swift test --package-path swift
      - run: bun test
        env:
          TANDEM_HOST: swift/.build/release/TandemProbe probe
          TANDEM_PLATFORM: swift

  kotlin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: kotlin/gradlew -p kotlin build installDist
      - run: bun test --timeout 20000
        env:
          TANDEM_HOST: kotlin/probe-host/build/install/probe-host/bin/probe-host probe
          TANDEM_PLATFORM: kotlin
